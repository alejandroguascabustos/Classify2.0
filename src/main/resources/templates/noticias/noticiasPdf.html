<!DOCTYPE html>
<!--
    Plantilla usada SOLO por NoticiaController#generarPdf (Flying Saucer / ITextRenderer).
    Va en: src/main/resources/templates/noticias/noticiasPdf.html

    Notas importantes:
    - Flying Saucer exige XHTML bien formado (todas las etiquetas cerradas).
    - No carga JS ni hojas de estilo externas de forma fiable: el CSS va en línea, aquí mismo.
    - Las imágenes deben referenciarse con una URI file:/// absoluta (ver
      NoticiaController#resolverImagenParaPdf); una ruta relativa tipo
      "/uploads/noticias/xxx.png" NO se puede resolver porque esa ruta solo
      existe como endpoint HTTP servido por Spring, no como recurso de disco.
    - Cada noticia es una <table> con <thead> (título + datos) y <tbody>
      (imagen + contenido) y "-fs-table-paginate: paginate;". Esto es lo
      que le indica a Flying Saucer que, si el contenido de una noticia no
      cabe en una sola página, repita el <thead> (título/autor/fecha/tipo)
      arriba de cada página siguiente en la que continúe esa noticia.
    - El ancho/alto de la imagen (imagenAncho/imagenAlto) vienen YA
      calculados desde el servidor (ver NoticiaController#resolverImagenParaPdf)
      para que quepa dentro de un recuadro máximo sin deformarse ni
      desbordar la página, incluso si la imagen original es muy alargada.
    - Se evitan emojis (✍ 📅) porque las fuentes base de iText no siempre los soportan;
      se usan etiquetas de texto en su lugar ("Autor:", "Fecha:").
    - Si los acentos (á, é, ñ...) no se ven bien en el PDF final, hay que registrar una
      fuente TTF (ver comentario en NoticiaController#generarPdf).
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cartelera Informativa - Classify</title>
    <style>
        @page {
            size: A4;
            margin: 20mm 16mm;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            color: #1e293b;
            font-size: 11px;
        }

        .encabezado {
            border-left: 5px solid #008000;
            padding-left: 12px;
            margin-bottom: 4px;
        }

        .encabezado h1 {
            font-size: 20px;
            color: #111827;
            margin: 0;
        }

        .meta-generacion {
            color: #64748b;
            font-size: 9px;
            margin: 4px 0 4px 12px;
        }

        .filtros-aplicados {
            color: #35b50b;
            font-size: 9px;
            margin: 0 0 16px 12px;
            font-weight: bold;
        }

        /* ── Cada noticia es una tabla con thead repetible ──────────── */
        table.noticia {
            width: 100%;
            border-collapse: collapse;
            /* Propiedad específica de Flying Saucer: obliga a repetir el
               encabezado de la tabla en cada página nueva si el cuerpo se desborda. */
            -fs-table-paginate: paginate;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #008000;
            margin-bottom: 14px;
        }

        .noticia-header-celda,
        .noticia-body-celda {
            padding: 10px 14px;
        }

        .noticia h2 {
            font-size: 14px;
            color: #013501;
            margin: 0 0 6px 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-all;
        }

        .noticia-meta {
            font-size: 9px;
            color: #64748b;
            margin-bottom: 0;
        }

        .noticia-meta .badge {
            display: inline-block;
            background: #f38f02;
            color: #ffffff;
            border-radius: 8px;
            padding: 1px 8px;
            margin-left: 6px;
        }

        .noticia-imagen {
            display: block;
            margin: 10px auto;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
        }

        .noticia-contenido {
            font-size: 10.5px;
            line-height: 1.5;
            color: #111827;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-all;
        }

        .sin-resultados {
            text-align: center;
            color: #64748b;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <div class="encabezado">
        <h1>Cartelera Informativa - Classify</h1>
    </div>
    <p class="meta-generacion" th:text="'Generado el ' + ${#temporals.format(fechaGeneracion, 'dd/MM/yyyy HH:mm')}"></p>

    <p class="filtros-aplicados"
       th:if="${filtroTipo != null or filtroDesde != null or filtroHasta != null}"
       th:text="'Filtros aplicados — ' +
                (${filtroTipo} != null ? ('Tipo: ' + ${filtroTipo} + '. ') : '') +
                (${filtroDesde} != null ? ('Desde: ' + ${#temporals.format(filtroDesde, 'dd/MM/yyyy')} + '. ') : '') +
                (${filtroHasta} != null ? ('Hasta: ' + ${#temporals.format(filtroHasta, 'dd/MM/yyyy')}) : '')">
    </p>

    <th:block th:if="${noticias != null and !noticias.isEmpty()}">
        <table class="noticia" th:each="noticia : ${noticias}">
            <thead>
                <tr>
                    <td class="noticia-header-celda">
                        <h2 th:text="${noticia.tituloNoticia}"></h2>
                        <div class="noticia-meta">
                            <span th:text="'Autor: ' + ${noticia.autorNoticia}"></span>
                            &#160;|&#160;
                            <span th:text="'Fecha: ' + ${#temporals.format(noticia.fechaNoticia, 'dd/MM/yyyy HH:mm')}"></span>
                            <span class="badge"
                                  th:if="${noticia.tipoNoticia != null and !#strings.isEmpty(noticia.tipoNoticia)}"
                                  th:text="${noticia.tipoNoticia}"></span>
                        </div>
                    </td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="noticia-body-celda">
                        <!-- Imagen: solo si existe en disco (imagenUrl != null). Ancho/alto
                             ya calculados en el servidor para que quepa sin deformarse. -->
                        <img th:if="${noticia.imagenUrl != null and !#strings.isEmpty(noticia.imagenUrl)}"
                             th:src="${noticia.imagenUrl}"
                             th:style="${noticia.imagenAncho != null and noticia.imagenAlto != null}
                                        ? ('width:' + ${noticia.imagenAncho} + 'px;height:' + ${noticia.imagenAlto} + 'px;')
                                        : 'width:460px;height:auto;'"
                             class="noticia-imagen"
                             alt="Imagen de la noticia"/>

                        <p class="noticia-contenido" th:text="${noticia.contenidoNoticia}"></p>
                    </td>
                </tr>
            </tbody>
        </table>
    </th:block>

    <div class="sin-resultados" th:if="${noticias == null or noticias.isEmpty()}">
        <p>No hay noticias que coincidan con los filtros seleccionados.</p>
    </div>

</body>
</html>
